[project]
name = "rct-bench"
version = "0.1.1"
description = "RollerCoaster Tycoon 2 (OpenRCT2) scenarios as agent tasks, played through our bridge on Prime sandboxes."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rct_bench"]
